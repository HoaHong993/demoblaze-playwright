name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 1 * * *' # nightly regression at 08:00 ICT
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag filter, e.g. @smoke or @regression (empty = all)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TEST_ENV: prod
  # Optional: set these as repository secrets to use a fixed account
  TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
  TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npx playwright test --project=api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-api
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ui:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies & browser
        run: |
          npm install
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        run: |
          GREP="${{ github.event.inputs.grep }}"
          if [ -n "$GREP" ]; then
            npx playwright test --project=${{ matrix.browser }} --grep "$GREP"
          else
            npx playwright test --project=${{ matrix.browser }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  mobile:
    name: Mobile smoke (Pixel 7 / iPhone 14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install
          npx playwright install --with-deps chromium webkit
      - run: npm run test:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-mobile
          path: playwright-report/
          retention-days: 14

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Public demo site timings fluctuate: report but don't block the pipeline
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install
          npx playwright install --with-deps chromium
      - run: npm run test:perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-performance
          path: playwright-report/
          retention-days: 14
